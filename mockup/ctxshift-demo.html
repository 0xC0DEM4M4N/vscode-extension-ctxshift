const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function hl(s){let c='';const i=s.indexOf('//');if(i>=0){c=s.slice(i);s=s.slice(0,i)}
 s=esc(s).replace(/('[^']*')/g,'<span class="s">$1</span>').replace(/\b(export|async|function|const|await|return|if|throw|new|import|from|let|for|of|describe|it)\b/g,'<span class="k">$1</span>').replace(/\b([a-zA-Z_]\w*)(?=\()/g,'<span class="f">$1</span>');
 return s+(c?`<span class="c">${esc(c)}</span>`:'')}

/* ---------- renderers ---------- */
function projRow(p,indent,fav){
 const cur=view.cur===p.id;
 const icon=cur?ico('folderact','color:#89d185'):ico(p.icon,p.color?`color:${COLORS[p.color]}`:'');
 const d=(cur?'current · ':'')+p.path;
 const sel=view.hover===(fav?'f':'r')+p.id;
 const isNew=view.treeNew.includes(p.id)?' new':'';
 const drop=view.dropOn==='row-'+p.id?' drop':'';
 return `<div class="row ${indent}${sel?' sel':''}${isNew}${drop}" id="${fav?'rowf-':'row-'}${p.id}">${icon}<span>${p.name}</span><span class="d">${d}</span><span class="acts">${ico('swap')}${ico('windows')}<span id="star-${fav?'f':'r'}${p.id}" style="display:flex">${ico(p.fav?'starfull':'star',p.fav?'color:#e2c08d':'')}</span>${ico('edit')}</span></div>`;
}
function renderTree(){
 const added=PROJ.filter(p=>p.added);let h=`<div class="vh"><span>Projects</span><span class="tb"><span id="tb-add">${ico('add')}</span><span id="tb-scan">${ico('search')}</span>${ico('refresh')}${ico('more')}</span></div>`;
 const favs=added.filter(p=>p.fav);
 if(favs.length){h+=`<div class="row"><svg class="i chev" viewBox="0 0 16 16">${P.chevd}</svg>${ico('starfull','color:#e2c08d')}<span class="grp">Favourites</span></div>`+favs.map(p=>projRow(p,'i1',true)).join('')}
 for(const g of GROUPS){const m=added.filter(p=>p.group===g);if(!m.length)continue;
  h+=`<div class="row${view.dropOn==='grp-'+g?' drop':''}" id="grp-${g}"><svg class="i chev" viewBox="0 0 16 16">${P.chevd}</svg>${ico('library')}<span class="grp">${g}</span></div>`+m.map(p=>projRow(p,'i1',false)).join('')}
 h+=added.filter(p=>!p.group).map(p=>projRow(p,'',false).replace('class="row ','class="row " style="padding-left:22px" data-x="').replace('data-x="','data-x="')).join('');
 $('projview').innerHTML=h;
}
function snapCounts(w){return{tabs:w.groups.reduce((n,g)=>n+g.tabs.length,0),terms:w.terms.length,bps:Object.values(w.bps).reduce((n,a)=>n+a.length,0)}}
function renderCtx(){
 const w=WS[view.cur];const c=snapCounts(w);
 const ch=view.ctxOpen?'chevd':'chevr';
 let h=`<div class="vh" id="ctxhead" style="height:30px"><span style="display:flex;align-items:center;gap:4px"><svg class="i chev" viewBox="0 0 16 16">${P[ch]}</svg>Saved Context</span></div>`;
 const r=(ic,l,d,ind,st)=>`<div class="row ${ind}">${ico(ic,st)}<span>${l}</span><span class="d">${d||''}</span></div>`;
 h+=r('history','Saved','just now','i1')+r('branch','Branch',w.branch,'i1');
 h+=`<div class="row">${ico('chevd')}${ico('files')}<span>Editors</span><span class="d">${c.tabs} tabs${w.groups.length>1?' in '+w.groups.length+' groups':''}</span></div>`;
 w.groups.forEach((g,gi)=>g.tabs.forEach(t=>h+=r(t.pin?'pin':'file',t.n,w.groups.length>1?'column '+(gi+1):'','i2')));
 h+=`<div class="row">${ico('chevd')}${ico('terminal')}<span>Terminals</span><span class="d">${c.terms}</span></div>`;
 w.terms.forEach(t=>h+=r('terminal',t.n,view.cur==='api'?'api-gateway':'checkout-web','i2'));
 h+=`<div class="row">${ico('chevd')}${ico('bp','color:#f14c4c')}<span>Breakpoints</span><span class="d">${c.bps}</span></div>`;
 $('ctxview').innerHTML=h;$('ctxview').classList.toggle('open',view.ctxOpen);
}
function renderEditor(){
 if(!view.groups.length||view.groups.every(g=>!g.tabs.length)){$('groups').innerHTML=`<div class="empty">${ico('ctx')}</div>`;return}
 $('groups').innerHTML=view.groups.map(g=>{
  const act=g.tabs[g.active];const f=act&&FILES[act.n];
  const tabs=g.tabs.map((t,i)=>`<div class="tab${i===g.active?' on':''} new">${t.pin?ico('pin','width:13px;height:13px'):''}${t.n}</div>`).join('');
  let code='';
  if(f){const cur=(WS[view.cur].cur||{})[act.n];const bps=(view.bps[act.n]||[]);
   code=f.lines.map((l,i)=>{const n=f.start+i;return `<div class="ln${n===cur?' cur':''}"><i${bps.includes(n)?' class="bp"':''}>${n}</i><span>${hl(l)}</span></div>`}).join('')}
  return `<div class="grp-ed"><div class="tabs">${tabs}</div><div class="crumb">src ${ico('chevr','width:12px;height:12px')} ${act?act.n:''}</div><div class="code mono">${code}</div></div>`}).join('');
}
function renderPanel(){
 const t=view.terms;
 const act=t[t.length-1];
 $('panel').innerHTML=`<div class="ph"><span>Problems</span><span>Output</span><span class="on">Terminal</span><span>Debug Console</span></div><div class="pb"><div class="term mono">${act?act.lines.map((l,i)=>`<div><span style="color:#89d185">${l.startsWith('$')?esc(l.slice(0,1)):''}</span>${esc(l.startsWith('$')?l.slice(1):l)}</div>`).join(''):''}</div>${t.length?`<div class="tl">${t.map((x,i)=>`<div class="${i===t.length-1?'on':''} new">${ico('terminal')}${x.n}</div>`).join('')}</div>`:''}</div>`;
}
function renderStatus(){
 const p=PROJ.find(x=>x.id===view.cur);const nb=Object.values(view.bps).reduce((n,a)=>n+a.length,0);
 $('status').innerHTML=`<div class="l"><span class="proj">${ico('folderact')}${p.name}</span><span>${ico('branch')}${view.branch||'…'}</span><span>${ico('err')}0</span>${view.msg?`<span class="msg">${ico('history')}${view.msg}</span>`:''}</div><div class="r"><span>${view.pos}</span><span>Spaces: 2</span><span>TypeScript</span></div>`;
 $('wtitle').textContent=p.name;
}
function renderAll(){renderTree();renderCtx();renderEditor();renderPanel();renderStatus()}

/* ---------- animation helpers ---------- */
const stage=$('stage');let cx=533,cy=280,dragging=false;
function place(x,y){cx=x;cy=y;$('cursor').style.transform=`translate(${x-4}px,${y-3}px)`;if(dragging)$('ghost').style.transform=`translate(${x+10}px,${y+8}px)`}
function pos(target,ox=0.5,oy=0.5){const el=typeof target==='string'?document.querySelector(target):target;const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return[(r.left-s.left+r.width*ox)/1.2,(r.top-s.top+r.height*oy)/1.2]}
async function moveTo(t,ox=0.5,oy=0.5,ms=800){const[x,y]=pos(t,ox,oy);place(x,y);await sleep(ms)}
async function click(){const r=document.createElement('div');r.className='rip';r.style.left=cx+'px';r.style.top=cy+'px';stage.appendChild(r);setTimeout(()=>r.remove(),600);await sleep(260)}
async function showKeys(keys,ms=1100){$('keys').innerHTML=keys.map(k=>`<b>${k}</b>`).join('');$('keys').classList.add('on');await sleep(ms);$('keys').classList.remove('on');await sleep(200)}
let capN=0;
async function cap(t){const c=$('cap');c.classList.remove('on');await sleep(200);capN++;c.innerHTML=`<em>${capN}</em>${t}`;c.classList.add('on')}
async function capOff(){$('cap').classList.remove('on');await sleep(250)}
async function toast(t,ms=2400){$('toast').innerHTML=ico('check','color:#89d185')+t;$('toast').classList.add('on');await sleep(ms);$('toast').classList.remove('on')}
async function veil(t,ms){$('veiltxt').textContent=t;$('veil').classList.add('on');await sleep(ms)}
function qp(o){ // o:{title,ph,typed,items,width}
 const items=o.items.map(i=>{
  if(i.sep)return`<div class="qsep">${i.sep}</div>`;
  const chk=i.chk!==undefined?`<span class="chk${i.chk?' y':''}">${i.chk?ico('check'):''}</span>`:'';
  const ic=i.ico?ico(i.ico,i.st||''):'';
  if(i.detail)return`<div class="qi two${i.on?' on':''}" id="${i.id||''}">${chk}${ic}<div class="tx"><div class="l">${i.label}<span class="ds">${i.desc||''}</span></div><div class="dt">${i.detail}</div></div>${i.btns?`<span class="btns">${i.btns.map(b=>ico(b)).join('')}</span>`:''}</div>`;
  return`<div class="qi${i.on?' on':''}" id="${i.id||''}">${chk}${ic}<span>${i.label}</span><span class="ds">${i.desc||''}</span></div>`}).join('');
 const w=$('qpw');const first=!w.firstChild;
 w.innerHTML=`<div class="qp${first?'':' still'}" ${o.width?`style="width:${o.width}px"`:''}>${o.title?`<div class="qt">${o.title}</div>`:''}<div class="qin">${o.typed?`<span class="t">${o.typed}</span>`:`<span style="display:none"></span>`}<b></b>${o.typed?'':`<span>${o.ph}</span>`}</div><div class="pad">${items}</div></div>`;
}
function qpClose(){$('qpw').innerHTML=''}
async function typeInto(fn,text,ms=130){let s='';for(const ch of text){s+=ch;fn(s);await sleep(ms)}}

/* ---------- switcher data ---------- */
function switcherItems(q){
 const added=PROJ.filter(p=>p.added&&(!q||p.name.includes(q)));
 const row=(p,on)=>({id:'qp-'+p.id,ico:view.cur===p.id?'folderact':p.icon,st:view.cur===p.id?'color:#89d185':(p.color?`color:${COLORS[p.color]}`:''),label:p.name,desc:(view.cur===p.id?'current':'')+(p.fav&&!q?((view.cur===p.id?' · ':'')+'slot '+(PROJ.filter(x=>x.added&&x.fav).indexOf(p)+1)):''),detail:p.path.replace('~','/Users/you'),on,btns:on?['starfull','windows','edit']:null});
 if(q)return added.map((p,i)=>row(p,i===0));
 const out=[];const favs=added.filter(p=>p.fav);
 if(favs.length){out.push({sep:'Favourites'});favs.forEach(p=>out.push(row(p,p.id===view.hoverQP)))}
 for(const g of GROUPS){const m=added.filter(p=>p.group===g&&!p.fav);if(m.length){out.push({sep:g});m.forEach(p=>out.push(row(p,false)))}}
 out.push({sep:'Manage'},{ico:'add',label:'Add project…'},{ico:'search',label:'Scan a folder for projects…'},{ico:'newfolder',label:'Create new project…'});
 return out;
}

/* ---------- restore animation ---------- */
async function restoreInto(id){
 const w=WS[id];const c=snapCounts(w);
 view.cur=id;view.groups=[];view.terms=[];view.bps={};view.branch='';view.pos='';view.msg='';renderAll();
 await veil('',0);$('veil').classList.remove('on');await sleep(650);
 view.groups=w.groups.map(()=>({tabs:[],active:0}));renderAll();await sleep(350);
 for(let gi=0;gi<w.groups.length;gi++){for(const t of w.groups[gi].tabs){view.groups[gi].tabs.push(t);view.groups[gi].active=view.groups[gi].tabs.length-1;renderEditor();await sleep(260)}
  view.groups[gi].active=w.groups[gi].active;renderEditor();await sleep(200)}
 view.pos=w.pos;for(const k in w.bps){view.bps[k]=w.bps[k]}renderAll();await sleep(400);
 for(const t of w.terms){view.terms.push(t);renderPanel();await sleep(450)}
 view.branch=w.branch;renderStatus();await sleep(400);
 view.msg=`Restored ${c.tabs} tabs, ${c.terms} terminal${c.terms>1?'s':''}, ${c.bps} breakpoint${c.bps>1?'s':''}`;renderAll();
 setTimeout(()=>{view.msg='';renderStatus()},4200);
}
async function doSwitch(id,fromName){
 await veil(`Saving ${fromName} context…`,700);
 $('veiltxt').textContent=`Opening ${PROJ.find(p=>p.id===id).name}…`;await sleep(850);
 await restoreInto(id);
}

/* ---------- drag ---------- */
async function drag(fromSel,toSel,label,icon){
 await moveTo(fromSel,0.3,0.5);
 const g=$('ghost');g.innerHTML=icon+label;g.style.display='flex';g.style.transition='none';dragging=true;g.style.transform=`translate(${cx+10}px,${cy+8}px)`;await sleep(60);g.style.transition='';
 await sleep(150);await moveTo(toSel,0.3,0.5,950);
 view.dropOn=toSel.replace('#','');renderTree();await sleep(500);
}

/* ---------- the script ---------- */
(async()=>{
 {const w=WS.checkout;view.groups=w.groups.map(g=>({...g,tabs:[...g.tabs]}));view.terms=[...w.terms];view.bps={...w.bps};view.branch=w.branch;view.pos=w.pos;}
 renderAll();place(800,430);
 // intro
 $('card').innerHTML=`<div class="logo"><svg viewBox="0 0 16 16" class="i">${P.ctx}</svg></div><h1>CtxShift</h1><p>Switch projects. Keep your context.</p><div class="ft">Tabs · layout · terminals · git branch · breakpoints</div>`;
 $('card').classList.add('on');await sleep(3000);$('card').classList.remove('on');await sleep(700);

 // 1. overview
 await cap('You are working in checkout-web: tabs, a terminal, a branch and breakpoints');await sleep(3200);

 // 2. switch with keyboard
 await cap('Switch project from anywhere with one shortcut');await sleep(600);
 await showKeys(['⌘','⌥','P'],1000);
 view.hoverQP=null;qp({ph:'Switch project…  (type to search)',typed:'',items:switcherItems('')});await sleep(1300);
 await typeInto(s=>qp({ph:'',typed:s,items:switcherItems(s)}),'api',220);await sleep(900);
 await moveTo('#qp-api',0.3,0.5,700);await click();qpClose();
 await cap('It saves where you were, then restores the other project exactly as you left it');
 await doSwitch('api','checkout-web');
 await sleep(3600);

 // 3. jump back
 await cap('Jump straight back to the previous project');await sleep(500);
 await showKeys(['⌘','⌥','O'],1100);
 await doSwitch('checkout','api-gateway');
 await sleep(3200);

 // 4. saved context
 await cap('See exactly what is saved for this project');
 await moveTo('#ctxhead',0.15,0.5,900);await click();view.ctxOpen=true;renderCtx();await sleep(3600);
 view.ctxOpen=false;renderCtx();await sleep(700);

 // 5. favourites + hover actions
 await cap('Favourites and quick actions on every row');
 view.hover='rrecipe';renderTree();await moveTo('#row-recipe',0.5,0.5,900);await sleep(900);
 await moveTo('#star-rrecipe',0.5,0.5,700);await click();
 PROJ.find(p=>p.id==='recipe').fav=true;view.hover=null;renderTree();await sleep(1800);

 // 6. scan for projects
 await cap('Scan a folder and add all your projects in one go');
 await moveTo('#tb-scan',0.5,0.5,900);await click();
 const scan=(c)=>qp({title:'Scan /Users/you/code',ph:'Select the folders to add as projects',typed:'',width:620,items:[
  {id:'sc-billing',chk:c[0],ico:'folder',label:'billing-portal',desc:'found package.json'},
  {id:'sc-exp',chk:c[1],ico:'folder',label:'experiments',desc:'found .git'},
  {id:'sc-dot',chk:c[2],ico:'folder',label:'dotfiles',desc:'found .git'},
  {id:'sc-old',chk:c[3],ico:'folder',label:'old-notes',desc:''}]});
 let ch=[false,false,false,false];scan(ch);await sleep(900);
 for(let i=0;i<3;i++){const id=['#sc-billing','#sc-exp','#sc-dot'][i];await moveTo(id,0.08,0.5,650);await click();ch[i]=true;scan(ch);await sleep(250)}
 await sleep(500);await showKeys(['↵'],700);qpClose();
 ['billing','exp','dot'].forEach(id=>{PROJ.find(p=>p.id===id).added=true});view.treeNew=['billing','exp','dot'];renderTree();
 await toast('Added 3 projects',2200);view.treeNew=[];await sleep(300);

 // 7. drag into groups
 await cap('Drag and drop to group and reorder');await sleep(400);
 await drag('#row-exp','#grp-Personal','experiments',ico('folder'));
 PROJ.find(p=>p.id==='exp').group='Personal';$('ghost').style.display='none';dragging=false;view.dropOn=null;renderTree();await sleep(900);
 await drag('#row-billing','#grp-Work','billing-portal',ico('folder'));
 PROJ.find(p=>p.id==='billing').group='Work';$('ghost').style.display='none';dragging=false;view.dropOn=null;renderTree();await sleep(1200);

 // 8. edit project: icon + colour
 await cap('Make each project yours: line icon, colour, group and sidebar view');
 view.hover='rbilling';renderTree();await moveTo('#row-billing',0.5,0.5,900);await sleep(500);
 const ed=PROJ.find(p=>p.id==='billing');
 const editItems=(on)=>[{id:'e-name',ico:'edit',label:'Name',desc:ed.name,on:on==='e-name'},{ico:'note',label:'Description',desc:'none'},{id:'e-group',ico:'library',label:'Group',desc:ed.group},{id:'e-icon',ico:'rocket',label:'Icon',desc:ed.icon,on:on==='e-icon'},{id:'e-color',ico:'color',label:'Colour',desc:ed.color||'default',on:on==='e-color'},{ico:'sidebar',label:'Sidebar view after switching',desc:'Source Control'},{ico:'folder',label:'Add folder…',desc:'1 folder'}];
 const [ex,ey]=pos('#row-billing .acts svg:last-child');place(ex,ey);await sleep(800);await click();
 qp({title:'Edit “billing-portal”',ph:'Choose what to change (Esc when done)',items:editItems(''),width:620});await sleep(900);
 await moveTo('#e-icon',0.2,0.5,700);qp({title:'Edit “billing-portal”',ph:'Choose what to change (Esc when done)',items:editItems('e-icon'),width:620});await click();
 const icons=[['folder','Folder'],['briefcase','Work'],['rocket','Rocket'],['beaker','Experiment'],['globe','Web'],['server','Server'],['heart','Personal']];
 const iconQP=(on)=>qp({ph:'Choose an icon',items:icons.map(([i,l])=>({id:'ic-'+i,ico:i,label:l,on:on===i})),width:520});
 iconQP('');await sleep(900);await moveTo('#ic-briefcase',0.2,0.5,700);iconQP('briefcase');await click();
 ed.icon='briefcase';renderTree();qp({title:'Edit “billing-portal”',ph:'Choose what to change (Esc when done)',items:editItems(''),width:620});await sleep(700);
 await moveTo('#e-color',0.2,0.5,700);qp({title:'Edit “billing-portal”',ph:'Choose what to change (Esc when done)',items:editItems('e-color'),width:620});await click();
 const cols=[['blue','Blue'],['orange','Orange'],['purple','Purple'],['green','Green'],['red','Red']];
 const colQP=(on)=>qp({ph:'Choose an icon colour',items:cols.map(([c,l])=>({id:'co-'+c,ico:'bp',st:`color:${COLORS[c]}`,label:l,on:on===c})),width:520});
 colQP('');await sleep(800);await moveTo('#co-purple',0.2,0.5,700);colQP('purple');await click();
 ed.color='purple';qpClose();view.hover=null;renderTree();await sleep(2600);

 // 9. end card
 await capOff();
 $('card').innerHTML=`<div class="logo"><svg viewBox="0 0 16 16" class="i">${P.ctx}</svg></div><h1>CtxShift</h1><p>Every project, exactly as you left it.</p>
 <div class="ks"><div><b>⌘ ⌥ P</b>Switch project</div><div><b>⌘ ⌥ O</b>Previous project</div><div><b>⌘ ⌥ 1–9</b>Favourite slots</div></div>
 <div class="ft">Also: multi-folder projects · open in new window · import / export · per-project settings · synced project list</div>`;
 $('card').classList.add('on');await sleep(4200);
 window.__done=true;
})();
</script></body></html>
